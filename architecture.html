<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packet SysTest Architecture</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 35%,#132844 0,#091626 45%,#050b14 100%);color:#edf7ff;font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}
header{text-align:center;padding:22px 16px 4px}
header h1{margin:0;font-size:clamp(21px,2.3vw,30px)}
header p{margin:8px auto 0;color:#9bb0c8;max-width:720px;font-size:14px;line-height:1.5}
.stage{width:100%;padding:6px 14px 16px}
svg{width:100%;height:auto;display:block}
text{font-family:Inter,Segoe UI,Arial,sans-serif}
.blkbg{fill:#13263c;stroke:#34516e;stroke-width:1.5}
.badge{fill:#1a3551;stroke:#3c678a;stroke-width:1}
.bicon{fill:#8ce5ff;font-size:18px}
.btitle{fill:#eaf4fb;font-size:17px;font-weight:600}
.itembg{fill:#0b1729;stroke:#28425f;stroke-width:1}
.iname{fill:#eaf4fb;font-size:14px}
.idev{fill:#9bb0c8;font-size:11px}
.mbg{fill:#173650}
.method{font-size:11px;font-weight:800;letter-spacing:.4px}
.item{cursor:pointer}
.item:hover .itembg{fill:#13304a;stroke:#5fd6ff}
.blk:hover .blkbg{stroke:#6edfff}
.corebg{fill:#123047;stroke:#3499b9;stroke-width:1.6}
.ctitle{fill:#ffffff;font-size:25px;font-weight:600}
.csub{fill:#a6c1d5;font-size:13px}
.cstatus{fill:#65edc2;font-size:12px;font-weight:700;letter-spacing:1px}
.wire{fill:none;stroke:#2d5775;stroke-width:5;stroke-linecap:round}
.flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:3 16;animation:move 1.1s linear infinite}
.flow.software{stroke:#5fd6ff;filter:drop-shadow(0 0 6px #5fd6ff)}
.flow.hardware{stroke:#ffc857;filter:drop-shadow(0 0 6px #ffc857)}
.flow.builtin{stroke:#ad8cff;filter:drop-shadow(0 0 6px #ad8cff)}
.flow.alm{stroke:#41d7a7;filter:drop-shadow(0 0 6px #41d7a7)}
@keyframes move{to{stroke-dashoffset:-38}}
.lkey{fill:#a8bed2;font-size:13px}
.tooltip{position:fixed;display:none;pointer-events:none;background:#07101d;color:#fff;border:1px solid #456780;border-radius:8px;padding:8px 11px;font-size:12px;max-width:280px;line-height:1.4;z-index:9;box-shadow:0 8px 22px #0009}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
</style></head>
<body>
<header><h1>Packet SysTest Integration Diagram</h1><p>Interactive view of the tool, connected hardware, software interfaces, the ECU, built-in verification blocks, and ALM integration.</p></header>
<div class="stage"><svg viewBox="0 0 1240 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Packet SysTest integration architecture">

<g class="blk"><rect class="blkbg" x="50" y="55" width="320" height="116" rx="16"/><rect class="badge" x="66" y="70" width="34" height="34" rx="9"/><text class="bicon" x="83" y="94" text-anchor="middle">▢</text><text class="btitle" x="110" y="93">Software Blocks</text><g class="item" data-info="Sends and receives UDP packets as part of the test sequence."><rect class="itembg" x="64" y="117" width="292" height="42" rx="10"/><text class="iname" x="78" y="135">UDP Packet</text><text class="idev" x="78" y="150">Ethernet datagram</text><rect class="mbg" x="312" y="127.0" width="40" height="22" rx="7"/><text class="method" x="332.0" y="142.0" text-anchor="middle" style="fill:#8ce5ff">UDP</text></g></g><g class="blk"><rect class="blkbg" x="50" y="380" width="320" height="214" rx="16"/><rect class="badge" x="66" y="395" width="34" height="34" rx="9"/><text class="bicon" x="83" y="419" text-anchor="middle">⚙</text><text class="btitle" x="110" y="418">Hardware Blocks</text><g class="item" data-info="Controls the Vötsch VT7004 environmental temperature chamber."><rect class="itembg" x="64" y="442" width="292" height="42" rx="10"/><text class="iname" x="78" y="460">Temperature Chamber</text><text class="idev" x="78" y="475">Vötsch VT7004</text><rect class="mbg" x="280" y="452.0" width="72" height="22" rx="7"/><text class="method" x="316.0" y="467.0" text-anchor="middle" style="fill:#ffd77c">CHAMBER</text></g><g class="item" data-info="Captures and inspects digital communication signals."><rect class="itembg" x="64" y="491" width="292" height="42" rx="10"/><text class="iname" x="78" y="509">Logic Analyzer</text><text class="idev" x="78" y="524">Saleae</text><rect class="mbg" x="296" y="501.0" width="56" height="22" rx="7"/><text class="method" x="324.0" y="516.0" text-anchor="middle" style="fill:#ffd77c">LOGIC</text></g><g class="item" data-info="Controls output voltage and current for the test bench."><rect class="itembg" x="64" y="540" width="292" height="42" rx="10"/><text class="iname" x="78" y="558">Power Supply</text><text class="idev" x="78" y="573">R&amp;S NGP800</text><rect class="mbg" x="312" y="550.0" width="40" height="22" rx="7"/><text class="method" x="332.0" y="565.0" text-anchor="middle" style="fill:#ffd77c">PSU</text></g></g><g class="blk"><rect class="blkbg" x="870" y="55" width="320" height="165" rx="16"/><rect class="badge" x="886" y="70" width="34" height="34" rx="9"/><text class="bicon" x="903" y="94" text-anchor="middle">▣</text><text class="btitle" x="930" y="93">ECU / DUT</text><g class="item" data-info="Electronic Control Unit under test — receives stimuli and returns responses."><rect class="itembg" x="884" y="117" width="292" height="42" rx="10"/><text class="iname" x="898" y="143">Electronic Control Unit</text><rect class="mbg" x="1132" y="127.0" width="40" height="22" rx="7"/><text class="method" x="1152.0" y="142.0" text-anchor="middle" style="fill:#89efc8">DUT</text></g><g class="item" data-info="Network connection between Packet SysTest and the ECU."><rect class="itembg" x="884" y="166" width="292" height="42" rx="10"/><text class="iname" x="898" y="192">Ethernet Interface</text><rect class="mbg" x="1132" y="176.0" width="40" height="22" rx="7"/><text class="method" x="1152.0" y="191.0" text-anchor="middle" style="fill:#89efc8">I/O</text></g></g><g class="blk"><rect class="blkbg" x="870" y="360" width="320" height="214" rx="16"/><rect class="badge" x="886" y="375" width="34" height="34" rx="9"/><text class="bicon" x="903" y="399" text-anchor="middle">✓</text><text class="btitle" x="930" y="398">Built-in Blocks</text><g class="item" data-info="Automatically checks a measured value or test condition."><rect class="itembg" x="884" y="422" width="292" height="42" rx="10"/><text class="iname" x="898" y="448">Check</text><rect class="mbg" x="1116" y="432.0" width="56" height="22" rx="7"/><text class="method" x="1144.0" y="447.0" text-anchor="middle" style="fill:#c8b7ff">CHECK</text></g><g class="item" data-info="Introduces a controlled wait into the test sequence."><rect class="itembg" x="884" y="471" width="292" height="42" rx="10"/><text class="iname" x="898" y="497">Delay</text><rect class="mbg" x="1116" y="481.0" width="56" height="22" rx="7"/><text class="method" x="1144.0" y="496.0" text-anchor="middle" style="fill:#c8b7ff">DELAY</text></g><g class="item" data-info="Displays a manual verification prompt to the operator."><rect class="itembg" x="884" y="520" width="292" height="42" rx="10"/><text class="iname" x="898" y="546">Message Box</text><rect class="mbg" x="1108" y="530.0" width="64" height="22" rx="7"/><text class="method" x="1140.0" y="545.0" text-anchor="middle" style="fill:#c8b7ff">MSGBOX</text></g></g><g class="blk"><rect class="blkbg" x="460" y="470" width="320" height="116" rx="16"/><rect class="badge" x="476" y="485" width="34" height="34" rx="9"/><text class="bicon" x="493" y="509" text-anchor="middle">↻</text><text class="btitle" x="520" y="508">ALM Integration</text><g class="item" data-info="After a test case is executed in Packet SysTest, the run result — status, executed steps and the pass/fail verdict — is automatically reflected to Polarion and linked back to its requirement in the ALM."><rect class="itembg" x="474" y="532" width="292" height="42" rx="10"/><text class="iname" x="488" y="558">Polarion</text><rect class="mbg" x="722" y="542.0" width="40" height="22" rx="7"/><text class="method" x="742.0" y="557.0" text-anchor="middle" style="fill:#8fe9c4">ALM</text></g></g>
<g>

 <g transform="translate(588,256)">
  <rect x="0" y="0" width="18" height="18" rx="4" fill="#55a8ff"/>

  <rect x="42" y="40" width="18" height="18" rx="4" fill="#66d5cb"/>
  <line x1="12" y1="16" x2="48" y2="42" stroke="#54d5ae" stroke-width="4" stroke-linecap="round"/>
  <line x1="18" y1="49" x2="42" y2="49" stroke="#54d5ae" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 8 l7 8 l16 -18" fill="none" stroke="#3be0a4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
 <text class="ctitle" x="620" y="352" text-anchor="middle">Packet SysTest</text>
 <text class="csub" x="620" y="374" text-anchor="middle">Test orchestration and control tool</text>
 <text class="cstatus" x="620" y="396" text-anchor="middle">● SIGNALS ACTIVE</text>
</g>
<g class="legend">
 <circle cx="330" cy="624" r="5" fill="#5fd6ff"/><text class="lkey" x="344" y="628">Data / UDP</text>
 <circle cx="500" cy="624" r="5" fill="#ffc857"/><text class="lkey" x="514" y="628">Hardware control</text>
 <circle cx="720" cy="624" r="5" fill="#ad8cff"/><text class="lkey" x="734" y="628">Test verification</text>
 <circle cx="930" cy="624" r="5" fill="#41d7a7"/><text class="lkey" x="944" y="628">ALM sync</text>
</g>
</svg></div>
<div class="tooltip" id="tip"></div>
<script>
const tip=document.getElementById('tip');
document.querySelectorAll('.item').forEach(el=>{
 el.addEventListener('mouseenter',()=>{tip.textContent=el.dataset.info;tip.style.display='block'});
 el.addEventListener('mousemove',e=>{tip.style.left=Math.min(e.clientX+14,window.innerWidth-290)+'px';tip.style.top=e.clientY+14+'px'});
 el.addEventListener('mouseleave',()=>tip.style.display='none');
});
function _postH(){try{parent.postMessage({archHeight:document.body.scrollHeight},'*')}catch(e){}}
window.addEventListener('load',_postH);window.addEventListener('resize',_postH);setTimeout(_postH,500);
</script>
</body></html>
